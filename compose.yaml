services:
  app:
    build: .
    image: solidcraft-issue-tracker:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRIAGE_DB_PATH: /data/triage.sqlite
      GRAPH_CACHE_TTL_MS: ${GRAPH_CACHE_TTL_MS:-60000}
    volumes:
      - ${DATA_DIR:-/srv/solidcraft-issue-tracker/data}:/data
    ports:
      - '127.0.0.1:3100:3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build: .
    image: solidcraft-issue-tracker:local
    restart: unless-stopped
    command: ['node', 'mcp/http.mjs']
    environment:
      ISSUES_API_URL: http://app:3000
      MCP_PORT: 3001
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '127.0.0.1:3101:3001'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sync:
    build: .
    image: solidcraft-issue-tracker:local
    profiles: ['sync']
    command: ['node', 'scripts/sync.mjs']
    env_file:
      - ${SYNC_ENV_FILE:-./.env.sync}
    environment:
      TRIAGE_DB_PATH: /data/triage.sqlite
    volumes:
      - ${DATA_DIR:-/srv/solidcraft-issue-tracker/data}:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'

  backup:
    build: .
    image: solidcraft-issue-tracker:local
    profiles: ['backup']
    command: ['node', 'scripts/backup.mjs']
    environment:
      TRIAGE_DB_PATH: /data/triage.sqlite
      BACKUP_DIR: /data/backups
    volumes:
      - ${DATA_DIR:-/srv/solidcraft-issue-tracker/data}:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
